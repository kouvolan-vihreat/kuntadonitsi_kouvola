  - id: "fossiilinen_liikenne"
    name: "Fossiilikäyttöisten autojen osuus"
    domain: "Ekologinen katto"
    source: "statfin_liikenne"
    threshold: 50.0
    unit: "%"
    direction: "lower_is_better"

  - id: "ilmanlaatu_altistus"
    name: "Pienhiukkasaltistus ja lähiympäristö"
