  # 1. SISÄKEHÄ: SOSIAALINEN PERUSTA (THL Sotkanet REST API)
  # ====================================================================
  - id: "sairastavuus"
    name: "Kansanterveys (THL sairastavuusindeksi)"
    domain: "Sosiaalinen perusta"
    source: "sotkanet"
    indicator_id: 244
    threshold: 100.0
    unit: "indeksi"
    direction: "lower_is_better"

  - id: "tyottomyys"
    name: "Työttömien osuus työvoimasta"
    domain: "Sosiaalinen perusta"
    source: "sotkanet"
    indicator_id: 181
    threshold: 8.0
    unit: "%"
    direction: "lower_is_better"

  - id: "toimeentulotuki"
    name: "Toimeentulotukea saaneet asukkaat"
    domain: "Sosiaalinen perusta"
    source: "sotkanet"
    indicator_id: 232
    threshold: 6.0
    unit: "%"
    direction: "lower_is_better"

  - id: "huoltosuhde"
    name: "Taloudellinen huoltosuhde"
    domain: "Sosiaalinen perusta"
    source: "sotkanet"
    indicator_id: 182
    threshold: 135.0
    unit: "indeksi"
    direction: "lower_is_better"

  # ====================================================================
  # 2. ULKOKEHÄ: EKOLOGINEN KATTO (SYKE PxWeb, StatFin PxWeb & Sotkanet)
  # ====================================================================
  - id: "hinku_paastot"
