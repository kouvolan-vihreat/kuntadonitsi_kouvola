name: Päivitä Kuntadonitsin data

on:
  schedule:
    # Ajetaan automaattisesti joka kuukauden 1. päivä klo 06:00 UTC
    - cron: '0 6 1 * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'config.yaml'
      - 'manual_indicators.csv'
      - 'fetch_data.py'

# Estää kahta ajoa muokkaamasta CSV-tiedostoja yhtä aikaa
concurrency:
  group: kuntadonitsi-data-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Lataa tietovarasto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Asenna riippuvuudet
        run: pip install -r requirements.txt

      - name: Hae tuorein main-haara ja paivita CSV-tiedostot
        run: |
          git pull origin main --no-rebase || true
          python fetch_data.py

      - name: Tallenna paivitetyt tulokset GitHubiin
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add doughnut_results.csv doughnut_history.csv
          git diff --staged --quiet || (git commit -m "Automaattinen datapaivitys (Sotkanet & SYKE)" && git push origin HEAD:main)
