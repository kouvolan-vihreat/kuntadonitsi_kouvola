name: Paivita Kuntadonitsin Data

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
  push:
    paths:
      - 'config.yaml'
      - 'fetch_data.py'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Lataa tietovarasto
        uses: actions/checkout@v4

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Asenna riippuvuudet
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Hae data rajapinnoista ja paivita CSV-tiedostot
        run: python fetch_data.py

      - name: Tallenna paivitetyt tulokset GitHubiin
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add doughnut_results.csv doughnut_history.csv
          if git diff --staged --quiet; then
            echo "Ei uusia datamuutoksia tallennettavaksi."
          else
            git commit -m "Automaattinen datapaivitys (Sotkanet & SYKE API)"
            git pull --rebase origin main || true
            git push
          fi
